<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Silhueta-jogador v4 — a linha que anda MORREU; a vida é a RESPIRAÇÃO:
       o brilho do traço sobe e desce suave (~5.5s, como o radar da vitrine),
       com o fill a acompanhar de leve e um halo do próprio traço a acender.
       currentColor puro (cores intocadas). reduced-motion: estático. "?" mantém. -->
  <style>
    .corpo { animation: silRespira 5.5s ease-in-out infinite; }
    .halo  { animation: silHalo 5.5s ease-in-out infinite; }
    @keyframes silRespira {
      0%, 100% { stroke-opacity: 0.55; fill-opacity: 0.12; }
      50%      { stroke-opacity: 1;    fill-opacity: 0.2; }
    }
    @keyframes silHalo {
      0%, 100% { stroke-opacity: 0; }
      50%      { stroke-opacity: 0.3; }
    }
    @media (prefers-reduced-motion: reduce) {
      .corpo, .halo { animation: none; }
      .corpo { stroke-opacity: 0.7; fill-opacity: 0.14; }
      .halo { stroke-opacity: 0; }
    }
  </style>
  <!-- halo do traço (acende com a respiração) -->
  <g class="halo" stroke="currentColor" stroke-width="6" stroke-linejoin="miter" fill="none" stroke-opacity="0">
    <polygon points="40,12 56,12 64,20 64,36 56,44 40,44 32,36 32,20"/>
    <path d="M14 88 L14 70 L24 58 L40 52 L56 52 L72 58 L82 70 L82 88 Z"/>
  </g>
  <!-- o busto anguloso da casa, a respirar -->
  <g class="corpo" stroke="currentColor" stroke-width="3" stroke-linejoin="miter" fill="currentColor" stroke-opacity="0.55" fill-opacity="0.12">
    <polygon points="40,12 56,12 64,20 64,36 56,44 40,44 32,36 32,20"/>
    <path d="M14 88 L14 70 L24 58 L40 52 L56 52 L72 58 L82 70 L82 88 Z"/>
  </g>
  <text x="48" y="34" text-anchor="middle" font-family="Rajdhani, sans-serif" font-size="16" font-weight="700" fill="currentColor" opacity="0.28">?</text>
</svg>
