# Futty — compila o app do iPhone na nuvem e manda para o TestFlight.
#
# Existe porque não há Mac aqui: o Xcode só roda em macOS, e este workflow
# aluga um por execução. Ninguém precisa instalar o Xcode.
#
# A assinatura é feita pelo fastlane match, não pela assinatura automática do
# Xcode. Motivo: rodado por linha de comando, o `xcodebuild archive` com
# assinatura automática decide sozinho assinar "para desenvolvimento" e aí
# exige um aparelho cadastrado na conta da Apple — coisa que um CI nunca vai
# ter. O match guarda certificado e perfil cifrados num repositório privado à
# parte (futty-certificates) e o build assina em modo manual. Ver IOS.md.
#
# Dispara à mão (Actions → iOS (TestFlight) → Run workflow) ou ao empurrar uma
# etiqueta v* (ex.: v1.0.1), que também passa a ser o número de versão.
name: iOS (TestFlight)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Duas execuções ao mesmo tempo dariam o mesmo número de build (é o número da
# execução) e a segunda seria recusada pela App Store Connect.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Compilar e enviar
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Buscar o código
        uses: actions/checkout@v4

      # Falhar aqui, com o nome do que falta, poupa 20 minutos de compilação
      # para morrer no fim com um erro que não diz nada.
      - name: Conferir os segredos
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_ASSETS_URL: ${{ secrets.VITE_ASSETS_URL }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8_BASE64: ${{ secrets.APPSTORE_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          faltam=""
          for nome in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_API_URL VITE_ASSETS_URL \
                      APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_P8_BASE64 APPLE_TEAM_ID \
                      MATCH_PASSWORD MATCH_DEPLOY_KEY; do
            if [ -z "${!nome}" ]; then faltam="$faltam $nome"; fi
          done
          if [ -n "$faltam" ]; then
            echo "::error::Faltam segredos no repositório:$faltam"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret (ver IOS.md)"
            exit 1
          fi
          echo "Os 10 segredos estão lá."

      # O Capacitor CLI exige Node >= 22.
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      # O `npm run build` termina em scripts/testar-visibilidade.mjs, que abre o
      # dist num Chromium de verdade para conferir que a página ABRE VISÍVEL
      # (build 11: o app chegou ao TestFlight com a página inteira no DOM mas em
      # opacity 0 — só fundo e aviso de cookies). O npm ci traz o pacote do
      # Playwright, mas não o browser; sem esta linha o build falha aqui.
      - name: Instalar o Chromium do Playwright
        run: npx playwright install chromium

      # O Vite lê este arquivo no modo production. Fica só no disco do runner,
      # que é destruído no fim; o .gitignore já o impede de ser commitado.
      # VITE_SENTRY_DSN fica de fora de propósito: sem DSN o Sentry não envia
      # nada, que é o que a ficha de Segurança de Dados das lojas declara.
      - name: Escrever o .env.production
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_ASSETS_URL: ${{ secrets.VITE_ASSETS_URL }}
        run: |
          cat > .env.production <<EOF
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          VITE_API_URL=${VITE_API_URL}
          VITE_ASSETS_URL=${VITE_ASSETS_URL}
          EOF
          echo "Escrito com $(wc -l < .env.production) variáveis."

      # vite build + tirar a mídia pesada de dist/ (o app busca-a do site) +
      # cap sync ios, que no macOS também roda o pod install.
      - name: Compilar a web e sincronizar o projeto iOS
        run: npm run build:native:ios

      # O runner traz mais de um Xcode e o padrão nem sempre é o mais novo.
      # Fixar explicitamente evita que uma troca de imagem do runner mude a
      # versão do compilador sem ninguém perceber.
      - name: Fixar o Xcode
        run: |
          echo "Xcodes no runner:"
          ls -d /Applications/Xcode*.app
          escolhido=$(ls -d /Applications/Xcode*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$escolhido/Contents/Developer"
          xcodebuild -version

      - name: pod install
        working-directory: ios/App
        run: pod install

      # O match guarda os certificados noutro repositório, privado. O Mac da
      # vez entra por esta chave de deploy, que só alcança esse repositório e
      # mais nada — não é um token da conta.
      - name: Instalar a chave de deploy dos certificados
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # A chave privada tem de terminar em quebra de linha ou o ssh recusa.
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "Testando o acesso ao repositório dos certificados:"
          ssh -T git@github.com 2>&1 | head -1 || true

      - name: Compilar e enviar (fastlane match)
        working-directory: ios/App
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8_BASE64: ${{ secrets.APPSTORE_P8_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4
          bundle exec fastlane beta

      # Guardar mesmo quando o envio falha: o .ipa fica na execução para se
      # entender o que saiu e para reenviar à mão se for preciso.
      - name: Guardar o .ipa na execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futty-ios-build-${{ github.run_number }}
          path: ios/App/build/*.ipa
          if-no-files-found: ignore
          retention-days: 30

      - name: Guardar os logs do fastlane
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: futty-ios-logs-${{ github.run_number }}
          path: |
            /Users/runner/Library/Logs/gym
            ios/App/fastlane/report.xml
          if-no-files-found: ignore
          retention-days: 7
