<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover (14-set, VELOCIDADE 5): sem isto o WebView do iPhone
         desenha a partir da faixa SEGURA por omissão — o site preenche o
         retângulo todo mas o conteúdo real, sem viewport-fit=cover, também não
         recebe env(safe-area-inset-*) nenhum (fica tudo a 0), então o topo e o
         gesto de baixo comem a topbar e a bottom nav. Com cover, o app desenha
         por baixo do relógio/ilha e da barra de gesto — e é o CSS (Layout.jsx,
         app.css) que devolve o espaço com env(safe-area-inset-top/bottom).
         maximum-scale=1 (Rodada 8A, 15-set): o iPhone dava zoom ao focar um
         campo e a tela ficava "desenquadrada". A causa é a fonte < 16 px (piso
         em index.css); isto é o cinto. É app nativo: o zoom de acessibilidade
         fica a cargo do sistema. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Futty</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#050810" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Futty" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- FONTES — locais desde 13-set. Vinham do Google Fonts em duas requisições:
         duas ligações novas (DNS + TLS) antes de a primeira letra aparecer, e no
         celular isso é o "salto de fonte" ao abrir. Agora são 4 arquivos woff2 em
         /fonts, subconjunto latin, 94 KB no total — e o app nativo não depende de
         rede nenhuma para desenhar texto.
         Caiu a requisição inteira do Chakra Petch: era pedida no arranque e não há
         uma única regra de CSS que a use.
         Só os pesos que existem: a Rajdhani não tem 800. As 43 regras com
         font-weight:800 já caíam no 700 (ou em negrito sintético); carregar 700 é
         o mais perto do que se pode. -->
    <style>
      /* Fundo de html/body ANTES de qualquer CSS/JS carregar (14-set, VELOCIDADE
         5): mesma cor do `backgroundColor` do capacitor.config.json — a casca
         nativa já pinta #080808 atrás do WebView antes dele existir; sem isto
         aqui, o primeiro frame do próprio WebView era branco (o padrão do
         browser) até o index.css chegar, um flash mais visível agora que o
         overlay de arranque de 1200ms saiu (Velocidade 5). O app.css assume a
         partir daí, com a paleta #050810 de sempre — a troca é sub-imperceptível,
         as duas cores são quase-pretas. */
      html, body { background: #080808; }
      @font-face {
        font-family: 'Rajdhani'; font-style: normal; font-weight: 400; font-display: swap;
        src: url('/fonts/rajdhani-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Rajdhani'; font-style: normal; font-weight: 600; font-display: swap;
        src: url('/fonts/rajdhani-600.woff2') format('woff2');
      }
      /* 700 cobre também o 800 pedido pelo CSS (a família não vai além de 700). */
      @font-face {
        font-family: 'Rajdhani'; font-style: normal; font-weight: 700 800; font-display: swap;
        src: url('/fonts/rajdhani-700.woff2') format('woff2');
      }
      /* Inter é variável: um arquivo só serve 400, 500 e 600. */
      @font-face {
        font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap;
        src: url('/fonts/inter-latin.woff2') format('woff2');
      }
    </style>
    <!-- A Rajdhani 700 é a que desenha títulos, HUD e números — é a primeira letra
         que a pessoa vê. Vai em preload para não esperar o CSS ser lido. -->
    <link rel="preload" href="/fonts/rajdhani-700.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
