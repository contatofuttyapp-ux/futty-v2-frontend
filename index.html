<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover (14-set, VELOCIDADE 5): sem isto o WebView do iPhone
         desenha a partir da faixa SEGURA por omissão — o site preenche o
         retângulo todo mas o conteúdo real, sem viewport-fit=cover, também não
         recebe env(safe-area-inset-*) nenhum (fica tudo a 0), então o topo e o
         gesto de baixo comem a topbar e a bottom nav. Com cover, o app desenha
         por baixo do relógio/ilha e da barra de gesto — e é o CSS (Layout.jsx,
         app.css) que devolve o espaço com env(safe-area-inset-top/bottom).
         maximum-scale=1 (Rodada 8A, 15-set): o iPhone dava zoom ao focar um
         campo e a tela ficava "desenquadrada". A causa é a fonte < 16 px (piso
         em index.css); isto é o cinto. É app nativo: o zoom de acessibilidade
         fica a cargo do sistema. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Futty</title>
    <meta name="description" content="Sorteio justo, ranking e figurinha de colecionador." />

    <!-- Prévia do link (WhatsApp, iMessage, redes) — Rodada 29H, item 7. Antes não havia og:image e o WhatsApp mostrava o F
         pequeno num círculo; agora é o ÍCONE DO APP (quadrado arredondado) centrado em 1200×630. Este é o PADRÃO, para o site
         inteiro. A URL é absoluta e de produção: quem lê a prévia é o robô do app de mensagem, que não passa pelo
         dev.futty.pages.dev. O arquivo tem versão no nome (-v1): a prévia fica guardada por muito tempo nesses apps; ao trocar
         a arte, trocar o nome (scripts/gerar-og.mjs) e esta linha.
         Achado 121 (Rodada 29J): /p/*, /s/*, /c/* e /convite/* têm prévia PRÓPRIA (o time, o convite, o campeonato) — uma
         Cloudflare Function troca estas mesmas tags antes de entregar o HTML, só para o robô (functions/_shared/previaDoLink.js).
         Uma pessoa abrindo o link no navegador continua a ver este index.html tal e qual. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Futty" />
    <meta property="og:title" content="O seu time. A sua figurinha." />
    <meta property="og:description" content="Sorteio justo, ranking e figurinha de colecionador." />
    <meta property="og:image" content="https://futtyapp.com.br/og/futty-1200x630-v1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="O ícone do Futty: um F dourado." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#050810" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Futty" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png?v=29w" />
    <!-- FONTES — locais desde 13-set. Vinham do Google Fonts em duas requisições:
         duas ligações novas (DNS + TLS) antes de a primeira letra aparecer, e no
         celular isso é o "salto de fonte" ao abrir. Agora são 4 arquivos woff2 em
         /fonts, subconjunto latin, 94 KB no total — e o app nativo não depende de
         rede nenhuma para desenhar texto.
         Caiu a requisição inteira do Chakra Petch: era pedida no arranque e não há
         uma única regra de CSS que a use.
         Só os pesos que existem: a Rajdhani não tem 800. As 43 regras com
         font-weight:800 já caíam no 700 (ou em negrito sintético); carregar 700 é
         o mais perto do que se pode. -->
    <style>
      /* Fundo de html/body ANTES de qualquer CSS/JS carregar (14-set, VELOCIDADE
         5): mesma cor do `backgroundColor` do capacitor.config.json — a casca
         nativa já pinta #080808 atrás do WebView antes dele existir; sem isto
         aqui, o primeiro frame do próprio WebView era branco (o padrão do
         browser) até o index.css chegar, um flash mais visível agora que o
         overlay de arranque de 1200ms saiu (Velocidade 5). O app.css assume a
         partir daí, com a paleta #050810 de sempre — a troca é sub-imperceptível,
         as duas cores são quase-pretas. */
      html, body { background: #080808; }
      /* O F de espera (ver o <div id="root"> abaixo): fixo no centro, respirando devagar. Sem movimento reduzido: parado. */
      .futty-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #080808; }
      .futty-splash svg { display: block; filter: drop-shadow(0 0 22px rgba(212, 160, 23, 0.35)); animation: futtySplashRespira 1.6s ease-in-out infinite; }
      @keyframes futtySplashRespira { 0%, 100% { opacity: 0.55; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .futty-splash svg { animation: none; opacity: 0.9; } }
      @font-face {
        font-family: 'Rajdhani'; font-style: normal; font-weight: 400; font-display: swap;
        src: url('/fonts/rajdhani-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Rajdhani'; font-style: normal; font-weight: 600; font-display: swap;
        src: url('/fonts/rajdhani-600.woff2') format('woff2');
      }
      /* 700 cobre também o 800 pedido pelo CSS (a família não vai além de 700). */
      @font-face {
        font-family: 'Rajdhani'; font-style: normal; font-weight: 700 800; font-display: swap;
        src: url('/fonts/rajdhani-700.woff2') format('woff2');
      }
      /* Inter é variável: um arquivo só serve 400, 500 e 600. */
      @font-face {
        font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap;
        src: url('/fonts/inter-latin.woff2') format('woff2');
      }
    </style>
    <!-- A Rajdhani 700 é a que desenha títulos, HUD e números — é a primeira letra
         que a pessoa vê. Vai em preload para não esperar o CSS ser lido. -->
    <link rel="preload" href="/fonts/rajdhani-700.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root">
      <!-- Rodada 29H (item 28): o F carregando ANTES de o JavaScript chegar. Quem toca em "Confirmar minha conta" no e-mail cai aqui
           com o cache frio: do redirecionamento do Supabase até a 1ª pintura do app era uma tela escura e vazia. O React troca
           este conteúdo na 1ª renderização (createRoot limpa o #root). É o F da casa (o mesmo contorno do FuttyLoader), só CSS: o
           estado natural é visível e nada depende de script (lei dos builds 10-12). -->
      <div class="futty-splash" aria-hidden="true">
        <svg width="112" height="112" viewBox="0 0 1080 1080">
          <defs><linearGradient id="futty-splash-ouro" gradientUnits="objectBoundingBox" x1="0.28" y1="0" x2="0.56" y2="1"><stop offset="0" stop-color="#e3a516"/><stop offset="0.45" stop-color="#b57305"/><stop offset="1" stop-color="#6b4204"/></linearGradient></defs>
          <path d="M392.28 576.53 L648.8 576.5 L659.27 541.52 L398.39 541.46 L472.99 285.11 L828.3 195.25 L839.06 152.39 L440.51 257.5 L210.76 1049.58 L110.36 1049.52 L360.67 177.16 L983.79 16.94 L913.11 270.83 L548.68 369.73 L532.74 441.62 L798.55 441.67 L732.82 676.38 L462.77 676.38 L354.76 1049.56 L249.78 1049.53 Z" fill="url(#futty-splash-ouro)"/>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
