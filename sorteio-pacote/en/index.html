    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What's a captain?","acceptedAnswer":{"@type":"Answer","text":"The player who anchors a team. Mark 👑 and the site puts one captain in each team before drawing the rest: your best players never end up together."}},{"@type":"Question","name":"What about goalkeepers?","acceptedAnswer":{"@type":"Answer","text":"Mark 🧤. Each team gets a goalkeeper first. If there are more keepers than teams, the extra ones play outfield."}},{"@type":"Question","name":"Can I balance the teams by skill?","acceptedAnswer":{"@type":"Answer","text":"Yes. Turn on \"Balance by skill\" and give everyone 1 to 5 stars. The draw spreads strong and weak players so no team gets everything."}},{"@type":"Question","name":"Does it work for five-a-side, small-sided and futsal?","acceptedAnswer":{"@type":"Answer","text":"Yes. You choose how many players per team, from 2 to 11, and the draw adjusts."}},{"@type":"Question","name":"If I draw again, will people know?","acceptedAnswer":{"@type":"Answer","text":"They will. From the second one on, the screen, the image and the link show \"Draw #2\". No more stacked teams."}},{"@type":"Question","name":"Do I need an app or an account?","acceptedAnswer":{"@type":"Answer","text":"No. It works in your phone browser, free and with no sign-up. The Futty app is this same draw as an app: it stays on your home screen, opens with one tap and keeps your draws safe."}}]}</script>
