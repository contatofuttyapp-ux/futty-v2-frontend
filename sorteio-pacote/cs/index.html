    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Co je nasazený hráč?","acceptedAnswer":{"@type":"Answer","text":"To je ten, kdo otevírá tým. Když označíš 👑, web dá do každého týmu jednoho nasazeného a teprve pak losuje ostatní: nejlepší nikdy nespadnou spolu."}},{"@type":"Question","name":"A brankáři?","acceptedAnswer":{"@type":"Answer","text":"Označ 🧤. Každý tým dostane brankáře dřív než ostatní. Když je brankářů víc než týmů, ti navíc hrají v poli."}},{"@type":"Question","name":"Dají se týmy vyrovnat podle úrovně?","acceptedAnswer":{"@type":"Answer","text":"Ano. Zapni „Vyrovnat týmy“ a každému dej 1 až 5 hvězd. Losování rozloží silné a slabší hráče tak, aby žádný tým neměl všechno."}},{"@type":"Question","name":"Hodí se to na malou kopanou, futsal a fotbálek s kamarády?","acceptedAnswer":{"@type":"Answer","text":"Ano. Vybereš počet hráčů na tým, od 2 do 11, a losování se přizpůsobí."}},{"@type":"Question","name":"Když losuju znovu, ostatní se to dozvědí?","acceptedAnswer":{"@type":"Answer","text":"Ano. Od druhého losování ukazuje obrazovka, obrázek i odkaz „2. losování“. Aby nebyly žádné domluvy."}},{"@type":"Question","name":"Musím si stáhnout aplikaci nebo se registrovat?","acceptedAnswer":{"@type":"Answer","text":"Ne. Funguje to v prohlížeči v telefonu, zdarma a bez registrace. Aplikace Futty je to samé losování jako aplikace: máš ji na ploše telefonu, otevřeš ji jedním klepnutím a tvoje losování jsou v bezpečí."}}]}</script>
