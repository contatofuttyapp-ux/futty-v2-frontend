    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"O que é cabeça de chave?","acceptedAnswer":{"@type":"Answer","text":"É quem abre um time. Marcou 👑, o site coloca um cabeça em cada time antes de sortear o resto: os craques nunca caem juntos."}},{"@type":"Question","name":"E os goleiros?","acceptedAnswer":{"@type":"Answer","text":"Marque 🧤. Cada time recebe um goleiro antes dos outros. Se tiver mais goleiros que times, os que sobram jogam na linha."}},{"@type":"Question","name":"Consigo equilibrar os times por nível?","acceptedAnswer":{"@type":"Answer","text":"Consegue. Ligue \"Equilibrar por nível\" e marque de 1 a 5 estrelas pra cada um. O sorteio espalha os fortes e os fracos pra nenhum time ficar com tudo."}},{"@type":"Question","name":"Serve pra racha, society e futsal?","acceptedAnswer":{"@type":"Answer","text":"Serve. Você escolhe quantos jogadores por time, de 2 a 11, e o sorteio se ajusta."}},{"@type":"Question","name":"Se eu sortear de novo, o pessoal fica sabendo?","acceptedAnswer":{"@type":"Answer","text":"Fica. A partir do segundo, a tela, a imagem e o link mostram \"2º sorteio\". É pra acabar com a panelinha."}},{"@type":"Question","name":"Precisa baixar app ou fazer cadastro?","acceptedAnswer":{"@type":"Answer","text":"Não. Funciona no navegador do celular, de graça e sem cadastro. O app do Futty é este mesmo sorteio em formato de aplicativo: fica na tela do celular, abre num toque e guarda seus sorteios com segurança."}}]}</script>
