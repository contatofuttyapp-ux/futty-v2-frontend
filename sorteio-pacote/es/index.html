    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"¿Qué es un cabeza de serie?","acceptedAnswer":{"@type":"Answer","text":"El que encabeza un equipo. Marcas 👑 y el sitio pone un cabeza en cada equipo antes de sortear al resto: los cracks nunca caen juntos."}},{"@type":"Question","name":"¿Y los arqueros?","acceptedAnswer":{"@type":"Answer","text":"Marca 🧤. Cada equipo recibe un arquero antes que los demás. Si hay más arqueros que equipos, los que sobran juegan de campo."}},{"@type":"Question","name":"¿Se pueden equilibrar los equipos por nivel?","acceptedAnswer":{"@type":"Answer","text":"Sí. Activa \"Equilibrar por nivel\" y ponle de 1 a 5 estrellas a cada uno. El sorteo reparte fuertes y flojos para que ningún equipo se lleve todo."}},{"@type":"Question","name":"¿Sirve para fútbol 5, fútbol 7 y futsal?","acceptedAnswer":{"@type":"Answer","text":"Sirve. Eliges cuántos jugadores por equipo, de 2 a 11, y el sorteo se ajusta."}},{"@type":"Question","name":"Si sorteo de nuevo, ¿se enteran?","acceptedAnswer":{"@type":"Answer","text":"Sí. Desde el segundo, la pantalla, la imagen y el link muestran \"2º sorteo\". Se acabaron los equipos armados a dedo."}},{"@type":"Question","name":"¿Hay que bajar una app o registrarse?","acceptedAnswer":{"@type":"Answer","text":"No. Funciona en el navegador del celular, gratis y sin registro. La app de Futty es este mismo sorteo en formato de aplicación: queda en la pantalla del celular, abre con un toque y guarda tus sorteos con seguridad."}}]}</script>
