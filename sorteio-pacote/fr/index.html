    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"C’est quoi, une tête de série ?","acceptedAnswer":{"@type":"Answer","text":"C’est celui qui ouvre une équipe. Si tu marques 👑, le site place une tête de série dans chaque équipe avant de tirer les autres : les meilleurs ne tombent jamais ensemble."}},{"@type":"Question","name":"Et les gardiens ?","acceptedAnswer":{"@type":"Answer","text":"Marque 🧤. Chaque équipe reçoit un gardien avant les autres. S’il y a plus de gardiens que d’équipes, ceux qui restent jouent dans le champ."}},{"@type":"Question","name":"Je peux équilibrer les équipes par niveau ?","acceptedAnswer":{"@type":"Answer","text":"Oui. Active « Équilibrer par niveau » et donne de 1 à 5 étoiles à chacun. Le tirage répartit les forts et les moins forts pour qu’aucune équipe n’ait tout."}},{"@type":"Question","name":"Ça marche pour le foot à 5, le foot à 7 et le futsal ?","acceptedAnswer":{"@type":"Answer","text":"Oui. Tu choisis le nombre de joueurs par équipe, de 2 à 11, et le tirage s’adapte."}},{"@type":"Question","name":"Si je refais le tirage, les autres le sauront ?","acceptedAnswer":{"@type":"Answer","text":"Oui. À partir du deuxième, l’écran, l’image et le lien affichent « 2e tirage ». Comme ça, fini les arrangements entre potes."}},{"@type":"Question","name":"Il faut installer une appli ou s’inscrire ?","acceptedAnswer":{"@type":"Answer","text":"Non. Ça marche dans le navigateur du téléphone, gratuitement et sans inscription. L’appli Futty, c’est ce même tirage en version application : elle reste sur l’écran de ton téléphone, s’ouvre d’un geste et garde tes tirages en sécurité."}}]}</script>
